[project]
name = "etl-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20",
    "celery[redis]>=5.5,<6",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "pyhocon>=0.3.61,<1",
    "openpyxl>=3.1,<4",
    "pyarrow>=18",
    "croniter>=6,<7",
    "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires an isolated PostgreSQL database",
    "external: requires explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src/etl_agent"]
check_untyped_defs = true
ignore_missing_imports = true
